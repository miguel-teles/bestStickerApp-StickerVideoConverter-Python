services:
  localstack:
    image: localstack/localstack:latest
    container_name: localstack

    ports:
      - "4566:4566"

    environment:
      - SERVICES=s3
      - DEBUG=1
      - AWS_DEFAULT_REGION=us-east-1

    volumes:
      - "./localstack:/var/lib/localstack"
      - "./localstack/init:/etc/localstack/init"
      - "/var/run/docker.sock:/var/run/docker.sock"