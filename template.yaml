AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  StickerVideoConverter

  Sample SAM Template for StickerVideoConverter

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 10

Resources:
  StickerVideoConverter:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      FunctionName: StickerVideoConverter
      CodeUri: src/
      Handler: app.lambda_handler
      Runtime: python3.13
      Architectures:
        - x86_64
      AutoPublishAlias: dev
      Environment:
        Variables:
          OUTPUT_BUCKET_NAME: beststickerapp-videoconvertion-out

Outputs:
  # ServerlessRestApi is an implicit API created out of Events key under Serverless::Function
  # Find out more about other implicit resources you can reference within SAM
  # https://github.com/awslabs/serverless-application-model/blob/master/docs/internals/generated_resources.rst#api
  StickerVideoConverterFunction:
    Description: Sticker Video Converter Lambda Function ARN
    Value: !GetAtt StickerVideoConverter.Arn
    Export:
      Name: StickerVideoConverterFunction

  StickerVideoConverterFunctionIamRole:
    Description: IAM Role for Sticker Video Converter Lambda
    Value: !GetAtt StickerVideoConverterRole.Arn
